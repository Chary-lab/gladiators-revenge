app = "gladiators-revenge"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9080"

[http_service]
  internal_port = 9080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
