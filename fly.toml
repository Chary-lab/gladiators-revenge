app = "gladiators-revenge-server"
primary_region = "gru"
# Miami (mia) está deprecada en Fly: no acepta máquinas nuevas. Con el POP que
# atiende Venezuela (gru), mover la máquina a EE. UU. añade un salto extra.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9080"
  SALAS = "1"
  # SUPABASE_SERVICE_KEY y SERVER_PUBLIC_URL se cargan como secretos:
  #   .\desplegar.ps1  (o: fly secrets set SUPABASE_SERVICE_KEY=... SERVER_PUBLIC_URL=https://<app>.fly.dev)
  # El maestro reparte la URL como wss://<app>.fly.dev/sala/<n>.

[http_service]
  internal_port = 9080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # Cada sala es un proceso Godot (~180 MB) más el maestro: una sola sala
  # pre-arrancada llega de sobra para 3 jugadores y no duplica el lobby.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
