app = "gladiators-revenge-server"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9080"
  SALAS = "2"
  # SUPABASE_SERVICE_KEY y SERVER_PUBLIC_URL se cargan como secretos:
  #   .\desplegar.ps1  (o: fly secrets set SUPABASE_SERVICE_KEY=... SERVER_PUBLIC_URL=https://<app>.fly.dev)
  # El maestro reparte la URL como wss://<app>.fly.dev/sala/<n>.

[http_service]
  internal_port = 9080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # Cada sala es un proceso Godot (~180 MB) más el maestro: 2 salas piden 1 GB.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
