app = "gladiators-revenge"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9080"
  SALAS = "2"
  # SUPABASE_SERVICE_KEY se carga con: fly secrets set SUPABASE_SERVICE_KEY=...
  # SERVER_PUBLIC_URL apunta a la URL pública (https://<app>.fly.dev) y el
  # maestro la reparte como wss://<app>.fly.dev/sala/<n>.

[http_service]
  internal_port = 9080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # Cada sala es un proceso Godot (~180 MB) más el maestro: 2 salas piden 1 GB.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
